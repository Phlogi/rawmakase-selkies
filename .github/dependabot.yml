name: Dependency updates

# Actions, and the LinuxServer baseimage tag, move on their own. The app's own
# version is handled by the update workflow instead, which reads releases rather
# than tags on an image.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
