# Dependency updates: actions and the digest-pinned LinuxServer base image.
# Dependabot cannot see OS packages inside the base image, so it advances the
# base digest; RAWmakase's own version is handled by the update workflow, which
# reads releases rather than tags on an image.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
